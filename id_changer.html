<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Minecraft PlayStation Vita PSN ID Changer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
    <script src="FileSaver.js"></script>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">&#8592;</a>
        
        <h1>Minecraft PSN ID Changer</h1>
        <select class="language-dropdown" onchange="changeLanguage()">
            <option value="English">English</option>
            <option value="Español">Español</option>
            <option value="Français">Français</option>
            <option value="日本語">日本語</option>
        </select>
        <br>
        <label class="label">Name (Vitacheat Label)</label>
        <span style="margin-left: 432px;"></span>
        <label class="label">Custom ID</label>
        <br>
        <div class="input-container">
            <input type="text" class="input" id="textBox3">
            <input type="text" class="input" id="textBox1">
        </div>
        <label class="title">Generated Code</label>
        <br>
        <textarea class="output" id="textBox2"></textarea>
        <br>
        <button class="button" onclick="button1_Click()">Generate Code</button>
        <button class="button" onclick="button2_Click()">Copy</button>
        <button class="button" onclick="button3_Click()">Save</button>
        <button class="button" onclick="button4_Click()">Erase</button>
        <br>
        <label id="etiqueta"></label>
    </div>
    
    <select id="savefile" class="savefile">
        <option value="PCSE00491">PCSE00491</option>
        <option value="PCSB00560">PCSB00560</option>
        <option value="PCSG00302">PCSG00302</option>
    </select>
</body>
</html>
